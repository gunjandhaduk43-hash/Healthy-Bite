<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In — Healthy Bite Restaurant Portal</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/app.css" rel="stylesheet">

    <style>
        body {
            background: #04120e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
            color: #f8fafc;
        }
        .font-display {
            font-family: 'Outfit', sans-serif;
        }
        .auth-card {
            background: rgba(8, 33, 26, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            max-width: 480px;
            width: 100%;
        }
        .glowing-btn-emerald {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
        }
        .glowing-btn-emerald:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
            color: #ffffff;
        }
    </style>
</head>
<body class="p-3">

    <div class="auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <a href="index.html" class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-25 text-success rounded-circle mb-3 text-decoration-none" style="width: 3.5rem; height: 3.5rem;">
                <span class="fs-4 fw-bold font-display">HB</span>
            </a>
            <h1 class="h3 mb-1 text-white font-display">Sign In to Healthy Bite</h1>
            <p class="text-white-50 small mb-0">Access your restaurant dashboard &amp; live kitchen operations.</p>
        </div>

        <!-- 1-Click Quick Fill Demo Buttons -->
        <div class="p-3 bg-white bg-opacity-5 rounded-3 border border-white border-opacity-10 mb-4">
            <div class="text-white-50 small fw-bold text-uppercase mb-2" style="font-size: 0.68rem; letter-spacing: 0.05em;"><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick 1-Click Demo Login:</div>
            <div class="d-grid gap-1.5">
                <button class="btn btn-sm btn-outline-success text-start d-flex justify-content-between align-items-center py-1.5 px-2.5" onclick="quickLogin('owner')">
                    <span>👑 <strong>Restaurant Owner</strong></span>
                    <span class="small opacity-75">owner@healthybite.com</span>
                </button>
                <button class="btn btn-sm btn-outline-info text-start d-flex justify-content-between align-items-center py-1.5 px-2.5" onclick="quickLogin('admin')">
                    <span>🛡️ <strong>Super Admin</strong></span>
                    <span class="small opacity-75">admin@healthybite.com</span>
                </button>
                <button class="btn btn-sm btn-outline-warning text-start d-flex justify-content-between align-items-center py-1.5 px-2.5" onclick="quickLogin('staff')">
                    <span>👨‍🍳 <strong>Kitchen Chef / Staff</strong></span>
                    <span class="small opacity-75">staff@healthybite.com</span>
                </button>
            </div>
        </div>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="mb-3">
                <label class="form-label text-white-50 small fw-semibold" for="email">Email address</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-white-50"><i class="bi bi-envelope"></i></span>
                    <input class="form-control bg-dark text-white border-secondary" id="email" type="email" required placeholder="owner@healthybite.com" value="owner@healthybite.com">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-white-50 small fw-semibold" for="password">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-white-50"><i class="bi bi-lock"></i></span>
                    <input class="form-control bg-dark text-white border-secondary" id="password" type="password" required value="Password@123">
                </div>
            </div>
            <button class="btn glowing-btn-emerald w-100 py-2.5 fw-bold d-flex align-items-center justify-content-center gap-2 rounded-pill" type="submit">
                <span>Sign In to Dashboard</span> <i class="bi bi-arrow-right-short fs-5"></i>
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="mb-0 text-white-50 small">New to Healthy Bite? <a class="text-success fw-semibold text-decoration-none" href="register.html">Register your restaurant</a></p>
        </div>
    </div>

    <script>
        function quickLogin(role) {
            if (role === 'owner') {
                window.location.href = 'dashboard.html';
            } else if (role === 'admin') {
                window.location.href = 'admin.html';
            } else if (role === 'staff') {
                window.location.href = 'dashboard.html?tab=orders';
            }
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.toLowerCase();
            if (email.includes('admin')) {
                window.location.href = 'admin.html';
            } else if (email.includes('staff')) {
                window.location.href = 'dashboard.html?tab=orders';
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
